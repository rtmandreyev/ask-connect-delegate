name: Validate presentation scaffold

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render the presentation
        run: quarto render presentation.qmd

      - name: Check the rendered deck
        run: |
          test -f presentation.html
          test -f presentation_files/libs/revealjs/dist/reveal.js
          test -f presentation_files/libs/revealjs/dist/reveal.css
